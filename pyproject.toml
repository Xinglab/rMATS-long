[build-system]
requires = ['setuptools >= 80.0.0', 'Cython >= 3.2.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'rmats-long'
version = '2.1.0'
dependencies = [
  'matplotlib>=3.7',
  'networkx>=2.8',
  'numpy>=1.24',
  'pandas>=2',
  'pydot>=3',
  'rpy2>=3.5',
  'threadpoolctl>=3.6',
]
requires-python = '>= 3.11'
maintainers = [
  {name = 'Eric Kutschera', email = 'kutscherae@chop.edu'},
]
description = 'Differential isoform analysis using long-read RNA-seq data'
readme = 'README.md'
license-files = ['LICENSE']
license = 'LicenseRef-rMATS-long'

[project.scripts]
rmats-long = 'rmats_long.command_line_interface:main'

[project.urls]
repository = 'https://github.com/Xinglab/rMATS-long.git'
